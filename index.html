  lastVisibleCx = lastVisibleCz = null;

  drops.forEach(d => scene.remove(d.mesh)); drops.length = 0;
  for (const p of activeParticles) scene.remove(p.mesh); activeParticles.length = 0;
  entities.forEach(e => { scene.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose(); });
  entities.length = 0;

  playerInventory.fill(null);
  if (mode === 'survival') {
    playerInventory[0] = { id: 4, count: 10 };
    playerInventory[1] = { id: 17, count: 5 };
    playerInventory[2] = { id: 30, count: 16 };
    playerInventory[3] = { id: 11, count: 1 };
  } else {
    playerInventory[0] = { id: 1, count: 64 };
    playerInventory[1] = { id: 3, count: 64 };
    playerInventory[2] = { id: 7, count: 64 };
    playerInventory[3] = { id: 11, count: 64 };
    playerInventory[4] = { id: 30, count: 64 };
    playerInventory[5] = { id: 33, count: 64 };
  }

  const sp = spawnPoint();
  player.pos.set(sp.x, sp.y, sp.z);
  player.vel.set(0, 0, 0); player.maxY = sp.y;
  yaw = 0; pitch = 0;
  updateModeUI(); renderHotbar();
  enterGame();
}
document.getElementById('btn-do-create').onclick = () => startNewWorld(false);

document.getElementById('btn-done-options').onclick = () => showScreen('screen-create');
document.getElementById('btn-cancel-options').onclick = () => showScreen('screen-create');
document.getElementById('btn-create-from-options').onclick = () => {
  const seedStr = document.getElementById('input-seed').value.trim();
  if (seedStr) SEED = isNaN(Number(seedStr)) ? hashString(seedStr) : Number(seedStr);
  else SEED = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
  startNewWorld(true);
};

document.getElementById('btn-done-settings').onclick = () => showScreen('screen-main');
const sliderFov = document.getElementById('slider-fov');
const fovValue = document.getElementById('fov-value');
sliderFov.oninput = () => { FOV = +sliderFov.value; fovValue.textContent = FOV; camera.fov = FOV; camera.updateProjectionMatrix(); };
const sliderRender = document.getElementById('slider-render');
const renderValue = document.getElementById('render-value');
sliderRender.oninput = () => {
  VIEW_RADIUS = +sliderRender.value; renderValue.textContent = VIEW_RADIUS;
  scene.fog.near = VIEW_RADIUS * 16 - 16; scene.fog.far = VIEW_RADIUS * 16 + 8;
  lastVisibleCx = null; lastVisibleCz = null;
};

document.getElementById('btn-resume').onclick = () => { if (!locked) requestLock(); };
document.getElementById('btn-pause-options').onclick = () => {
  showScreen('screen-settings');
  document.getElementById('btn-done-settings').onclick = () => showScreen('screen-pause');
};
document.getElementById('btn-save-quit').onclick = () => {
  downloadSave(); showScreen('screen-main'); document.exitPointerLock();
  if (bc && joinedLAN) bc.postMessage({ type: 'player_leave', name: myName });
};

function requestLock() {
  showScreen(null);
  const p = renderer.domElement.requestPointerLock();
  if (p && typeof p.catch === 'function') {
    p.catch(() => { if (!document.pointerLockElement) showScreen('screen-pause'); });
  }
}
renderer.domElement.addEventListener('click', () => {
  if (!locked && uiLayer.classList.contains('hidden') && invScreen.classList.contains('hidden')) requestLock();
});

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (!locked) {
    for (const k in keys) keys[k] = false; mouseLeft = false; mineBar.classList.remove('on');
    if (uiLayer.classList.contains('hidden') && invScreen.classList.contains('hidden') && chatInput.style.display !== 'block') {
      showScreen('screen-pause');
      document.getElementById('btn-done-settings').onclick = () => showScreen('screen-main');
    }
  } else {
    showScreen(null);
  }
});

function enterGame() {
  document.getElementById('btn-done-settings').onclick = () => showScreen('screen-main');
  showScreen(null); requestLock();
  const pcx = Math.floor(player.pos.x / CHUNK), pcz = Math.floor(player.pos.z / CHUNK);
  for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) rebuildChunkMesh(pcx + dx, pcz + dz);
}

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const name = file.name.replace('.json', '');
      savedWorlds.push({ name, mode: data.mode || 'survival', data });
      toast('存档导入成功'); loadWorldList();
    } catch (e) { toast('导入失败：' + e.message); }
  };
  reader.readAsText(file); e.target.value = '';
};

function b64FromBytes(u8) {
  let s = ''; const step = 0x8000;
  for (let i = 0; i < u8.length; i += step) s += String.fromCharCode.apply(null, u8.subarray(i, i + step));
  return btoa(s);
}
function rleEncode(arr) {
  const out = []; let i = 0;
  while (i < arr.length) {
    const v = arr[i]; let c = 1;
    while (i + c < arr.length && arr[i + c] === v && c < 255) c++;
    out.push(v, c); i += c;
  }
  return b64FromBytes(new Uint8Array(out));
}
function rleDecode(b64, expectedSize) {
  const bin = atob(b64); const out = new Uint8Array(expectedSize);
  let o = 0;
  for (let i = 0; i + 1 < bin.length && o < expectedSize; i += 2) {
    const v = bin.charCodeAt(i), c = bin.charCodeAt(i + 1);
    for (let k = 0; k < c && o < expectedSize; k++) out[o++] = v;
  }
  return out;
}

function buildSaveData() {
  const chunks = [];
  for (const key of dirtyChunks) { const c = chunkStore.get(key); if (c) chunks.push({ key, data: rleEncode(c) }); }
  return {
    app: 'minecraft-web', version: 4, infinite: true, seed: SEED,
    player: { x: +player.pos.x.toFixed(3), y: +player.pos.y.toFixed(3), z: +player.pos.z.toFixed(3), yaw: +yaw.toFixed(4), pitch: +pitch.toFixed(4) },
    mode, health, hunger, saturation, selected, inventory: playerInventory, chunks
  };
}

function applySaveData(data) {
  for (const mesh of chunkMeshes.values()) { scene.remove(mesh); mesh.geometry.dispose(); }
  chunkMeshes.clear(); chunkStore.clear(); dirtyChunks.clear(); loadQueue.length = 0; pendingMeshUpdates.clear(); lastVisibleCx = lastVisibleCz = null;
  drops.forEach(d => scene.remove(d.mesh)); drops.length = 0;
  for (const p of activeParticles) scene.remove(p.mesh); activeParticles.length = 0;

  SEED = data.seed || 20241024;
  if (Array.isArray(data.chunks)) {
    for (const c of data.chunks) { chunkStore.set(c.key, rleDecode(c.data, CHUNK * WY * CHUNK)); dirtyChunks.add(c.key); }
  }
  if (data.player) {
    player.pos.set(Number(data.player.x) || 0, Number(data.player.y) || 20, Number(data.player.z) || 0);
    yaw = Number(data.player.yaw) || 0; pitch = Number(data.player.pitch) || 0;
    player.vel.set(0,0,0); player.maxY = player.pos.y; player.onGround = false; flying = false;
  }
  if (data.mode === 'creative' || data.mode === 'survival') mode = data.mode;
  if (typeof data.health === 'number') health = Math.max(0, Math.min(20, data.health));
  if (typeof data.hunger === 'number') hunger = Math.max(0, Math.min(20, data.hunger));
  if (typeof data.saturation === 'number') saturation = Math.max(0, Math.min(20, data.saturation));
  if (Array.isArray(data.inventory)) {
    playerInventory = data.inventory.map(it => it && ITEMS[it.id] ? { ...it } : null);
    while (playerInventory.length < 36) playerInventory.push(null);
    playerInventory.length = 36;
  }
  if (typeof data.selected === 'number') selected = Math.max(0, Math.min(8, data.selected));
  exhaustion = 0; foodTimer = 0;
  updateModeUI(); renderHotbar();
}

function downloadSave() {
  try {
    const json = JSON.stringify(buildSaveData());
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'minecraft_save_' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1200);
    toast('存档已下载');
  } catch (e) { toast('保存失败'); }
}
/* ============================================================
   全局事件与主循环
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 聊天输入框事件
chatInput.addEventListener('keydown', (e) => {
  if (e.code === 'Enter') {
    const text = chatInput.value.trim();
    if (text.startsWith('/')) {
      executeCommand(text);
    } else {
      sendChatMessage(text);
    }
    closeChat();
    e.stopPropagation();
  } else if (e.code === 'Escape') {
    closeChat();
    e.stopPropagation();
  }
});

addEventListener('keydown', (e) => {
  // 如果聊天框正在活跃，忽略游戏按键
  if (document.activeElement === chatInput) return;

  if (e.code === 'Space') e.preventDefault();
  
  if (e.code === 'F3') {
    e.preventDefault();
    debugOn = !debugOn;
    debugEl.style.display = debugOn ? 'block' : 'none';
    return;
  }

  // T 或 Enter 打开聊天
  if (e.code === 'KeyT' || e.code === 'Enter') {
    if (locked) { openChat(); return; }
  }

  if (e.code === 'KeyE') {
    if (invScreen.classList.contains('hidden') && locked) toggleInventory(true, false);
    else if (!invScreen.classList.contains('hidden')) toggleInventory(false);
    return;
  }
  if (e.code === 'Escape' && !invScreen.classList.contains('hidden')) {
    toggleInventory(false); return;
  }

  if (e.code === 'Space' && !e.repeat && mode === 'creative' && locked) {
    const now = performance.now();
    if (now - lastSpaceTap < 320) {
      flying = !flying; player.vel.y = 0; if (flying) player.maxY = player.pos.y;
      toast(flying ? '飞行：开' : '飞行：关');
    }
    lastSpaceTap = now;
  }

  keys[e.code] = true;
  if (e.code.startsWith('Digit')) {
    const n = parseInt(e.code.slice(5), 10);
    if (n >= 1 && n <= 9) selectSlot(n - 1);
  }
});

addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseLeft = false; });
addEventListener('wheel', (e) => { 
  if (locked && invScreen.classList.contains('hidden')) selectSlot(selected + (e.deltaY > 0 ? 1 : -1)); 
}, { passive: true });

addEventListener('mousemove', (e) => {
  if (!locked || !invScreen.classList.contains('hidden')) return;
  yaw -= e.movementX * 0.0022; pitch -= e.movementY * 0.0022;
  const lim = Math.PI / 2 - 0.001; pitch = Math.max(-lim, Math.min(lim, pitch));
});

addEventListener('mousedown', (e) => {
  if (!invScreen.classList.contains('hidden')) return;
  if (!locked) return;
  if (!uiLayer.classList.contains('hidden')) return;
  
  if (e.button === 0) { 
    mouseLeft = true; mining.key = ''; mining.progress = 0; mining.particleAcc = 0; 
  } else if (e.button === 2) {
    const item = getHeldItem();
    // 右键吃东西
    if (item && ITEMS[item.id] && ITEMS[item.id].type === 'food') {
      if (hunger >= 20 && saturation >= 20) { toast('你已经饱了'); return; }
      hunger = Math.min(20, hunger + ITEMS[item.id].heal);
      saturation = Math.min(hunger, saturation + ITEMS[item.id].sat);
      item.count--;
      if (item.count <= 0) playerInventory[selected] = null;
      renderHotbar(); renderHeartsAndFood();
      toast('吃掉了 ' + ITEMS[item.id].name); return;
    }
    // 右键工作台
    if (currentHit) {
      const block = getBlock(currentHit.x, currentHit.y, currentHit.z);
      if (block === B.CRAFTING_TABLE && mode === 'survival') { toggleInventory(true, true); return; }
    }
    // 右键放置方块
    placeBlock();
  }
});

addEventListener('mouseup', (e) => {
  if (e.button === 0) { mouseLeft = false; mining.key = ''; mining.progress = 0; mining.particleAcc = 0; mineBar.classList.remove('on'); }
});
addEventListener('contextmenu', (e) => e.preventDefault());

let last = performance.now(), coordTick = 0;

function updateCoords() {
  if (++coordTick % 8 !== 0) return;
  const bx = Math.floor(player.pos.x), by = Math.floor(player.pos.y), bz = Math.floor(player.pos.z);
  const biome = getBiome(bx, bz);
  const coordsEl = document.getElementById('coords');
  coordsEl.textContent = `X: ${bx}  Y: ${by}  Z: ${bz}\n${biome === 'desert' ? '沙漠' : biome === 'snow' ? '雪地' : '平原'}`;
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (locked && invScreen.classList.contains('hidden')) updatePlayer(dt);
  camera.position.set(player.pos.x, player.pos.y + player.eye, player.pos.z);
  camera.rotation.set(pitch, yaw, 0);

  updateVisibleChunks(player.pos.x, player.pos.z);
  processChunkQueue(locked ? 1 : 3);
  processMeshUpdates(locked ? 2 : 5);
  
  if (locked) {
    updateHighlight(); updateMining(dt); updateEntities(dt); updateOtherPlayers();
  }
  
  updateParticles(dt); updateDrops(dt); updateCoords(); updateDebug(dt);

  // 挖掘裂纹渲染
  if (locked && mouseLeft && mining.progress > 0 && mining.progress < 1 && currentHit && mode !== 'creative') {
    crackMesh.visible = true;
    crackMesh.position.set(currentHit.x + 0.5, currentHit.y + 0.5, currentHit.z + 0.5);
    const stage = Math.min(CRACK_STAGES - 1, Math.floor(mining.progress * CRACK_STAGES));
    crackTex.offset.x = stage / CRACK_STAGES;
  } else {
    crackMesh.visible = false;
  }

  renderer.render(scene, camera);
}

// 初始化并启动主循环
updateModeUI();
showScreen('screen-main');
animate();
</script>
